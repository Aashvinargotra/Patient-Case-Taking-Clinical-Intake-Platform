<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediKiosk — Physician Clinical Console</title>
    <meta name="description" content="Dedicated Physician Review Console, OPD Queue, & Digital Case Sheet Verification">

    <!-- Google Fonts & Stylesheets -->
    <link rel="stylesheet" href="css/portal_tokens.css">
    <link rel="stylesheet" href="css/portal_layout.css">
    <link rel="stylesheet" href="css/views.css">
</head>
<body>
    <div class="portal-container">
        
        <!-- Left Collapsible Sidebar -->
        <aside class="portal-sidebar" role="navigation" aria-label="Portal Navigation">
            <div>
                <div class="sidebar-header">
                    <div class="sidebar-logo-icon">🏥</div>
                    <div>
                        <div class="sidebar-brand-title">MediKiosk</div>
                        <div class="sidebar-brand-sub">Physician Clinical Suite</div>
                    </div>
                </div>

                <!-- Navigation Tabs Root -->
                <div class="sidebar-nav" id="sidebar-nav-root"></div>
            </div>

            <div class="sidebar-footer">
                <div class="user-profile-badge">
                    <div class="user-avatar" style="background: #0d9488; color: #ffffff; font-weight: 800;">DR</div>
                    <div>
                        <div style="font-size: 13px; font-weight: 800; color: #0f172a;" id="sidebar-doc-name">Dr. Ananya Sharma</div>
                        <div style="font-size: 11px; color: #0d9488; font-weight: 700;" id="sidebar-doc-room">Room A-101 (Ground Floor)</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="portal-main-area">
            
            <!-- Top Navigation & Hotkey Bar -->
            <header class="portal-topbar" role="banner" style="background: #ffffff; border-bottom: 1.5px solid #e2e8f0; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <!-- Universal Hotkey Trigger -->
                    <div class="search-hotkey-trigger" id="hotkey-search-trigger" role="button" tabindex="0" aria-label="Search Patient ID or Name. Press Control K" style="background: #f8fafc; border: 1.5px solid #cbd5e1; color: #0f172a; padding: 8px 16px; border-radius: 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <span>🔍</span>
                        <span>Search Patient Case...</span>
                        <span class="hotkey-badge" style="background: #e2e8f0; color: #334155; font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 4px;">Ctrl + K</span>
                    </div>

                    <!-- Active Doctor Department & Room Badge -->
                    <div id="doctor-dept-badge" style="background: #f0fdfa; border: 1.5px solid #99f6e4; color: #0d9488; padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px;">
                        <span>🌿</span>
                        <span id="badge-dept-text">Kayachikitsa OPD • Room A-101</span>
                    </div>
                </div>

                <div class="topbar-right" style="display: flex; align-items: center; gap: 14px;">
                    <!-- WebSocket Live Triage Connection Badge -->
                    <div class="ws-status-badge" style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: #15803d; background: #dcfce7; border: 1px solid #bbf7d0; padding: 6px 14px; border-radius: 9999px;">
                        <div class="ws-dot" style="width: 8px; height: 8px; background: #15803d; border-radius: 50%;"></div>
                        <span>Live OPD Queue Connected</span>
                    </div>
                </div>
            </header>

            <!-- Dynamic Viewport Content -->
            <main class="portal-content-viewport" id="portal-viewport-root" role="main" style="flex: 1; padding: 24px 32px; overflow-y: auto;"></main>

        </div>

    </div>

    <!-- Hotkey Modal Container -->
    <div id="hotkey-modal-root"></div>

    <!-- Main Module Script -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
