version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medikiosk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medikiosk_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-medikiosk_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medikiosk_admin} -d ${POSTGRES_DB:-medikiosk_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medikiosk_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medikiosk_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      KMS_DATA_ENCRYPTION_KEY: ${KMS_DATA_ENCRYPTION_KEY}
      BLIND_INDEX_PEPPER: ${BLIND_INDEX_PEPPER}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET}
      SECRET_KEY: ${SECRET_KEY}
      BHASHINI_USER_ID: ${BHASHINI_USER_ID}
      BHASHINI_API_KEY: ${BHASHINI_API_KEY}
      BHASHINI_PIPELINE_ID: ${BHASHINI_PIPELINE_ID}
    networks:
      - backend_net

  nginx:
    image: nginx:alpine
    container_name: medikiosk_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge

volumes:
  pgdata:
  redis_data:
